<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vehicles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F3F5F8; color: #0F172A; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; position: relative">

<header style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Vehicles</h1>
<span style="font-size: 13px; color: #4B5565">212 registered · 3 blocked</span>
</header>

<div style="padding: 0 20px">
<label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #DCE1E8; color: #4B5565">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input type="search" placeholder="Search plate, name or flat" aria-label="Search vehicles" style="flex-grow: 1; border: none; outline: none; font-family: inherit; font-size: 15px; background: transparent; color: #0F172A">
</label>
</div>

<div role="tablist" aria-label="Category" style="padding: 12px 20px; display: flex; gap: 8px">
<button type="button" role="tab" aria-selected="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: #0F172A; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">All</button>
<button type="button" role="tab" aria-selected="false" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #DCE1E8; background: #FFFFFF; color: #0F172A; font-family: inherit; font-size: 13px; font-weight: 500">Residents</button>
<button type="button" role="tab" aria-selected="false" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #DCE1E8; background: #FFFFFF; color: #0F172A; font-family: inherit; font-size: 13px; font-weight: 500">Staff</button>
<button type="button" role="tab" aria-selected="false" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #DCE1E8; background: #FFFFFF; color: #0F172A; font-family: inherit; font-size: 13px; font-weight: 500">Blocked</button>
</div>

<div style="padding: 0 20px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{cars}}" as="c" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid {{c.border}}; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px; border-radius: 22px; background: {{c.avBg}}; color: {{c.avFg}}; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{c.initials}}</span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; letter-spacing: 0.5px">{{c.plate}}</span>
<span style="font-size: 12px; color: #4B5565">{{c.who}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.4px; padding: 3px 7px; border-radius: 6px; background: {{c.bg}}; color: {{c.fg}}">{{c.tag}}</span>
<label style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #4B5565">Block
<sc-if value="{{c.blocked}}" hint-placeholder-val="{{ false }}"><input type="checkbox" role="switch" checked aria-label="Blocked" style="width: 20px; height: 20px; accent-color: #B91C1C"></sc-if>
<sc-if value="{{c.open}}" hint-placeholder-val="{{ true }}"><input type="checkbox" role="switch" aria-label="Blocked" style="width: 20px; height: 20px; accent-color: #B91C1C"></sc-if>
</label>
</div>
</div>
</sc-for>
</div>

<a href="AddVehicle.dc.html" style="position: absolute; right: 20px; bottom: 100px; height: 56px; padding: 0 20px; border-radius: 16px; background: #0F766E; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; box-shadow: 0 6px 16px rgba(15,23,42,0.18)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add vehicle</a>

<div style="flex-grow: 1"></div>
<dc-import name="NavBar" active="vehicles" hint-size="390px,80px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const cat = {
      RESIDENT: { tag: 'RESIDENT', bg: '#E6F4F2', fg: '#0B5F58', avBg: '#CCEBE7', avFg: '#0B5F58' },
      STAFF: { tag: 'STAFF', bg: '#FEF3C7', fg: '#78350F', avBg: '#FDE7B0', avFg: '#78350F' },
      VISITOR: { tag: 'VISITOR', bg: '#DCE7FB', fg: '#1E3A8A', avBg: '#DCE7FB', avFg: '#1E3A8A' },
      BLOCKED: { tag: 'BLOCKED', bg: '#FDE8E8', fg: '#991B1B', avBg: '#FDE8E8', avFg: '#991B1B' },
    };
    const mk = (plate, initials, who, c, blocked) => ({ plate, initials, who, ...cat[c], blocked, open: !blocked, border: blocked ? '#F5B5B5' : '#DCE1E8' });
    return {
      cars: [
        mk('MH 12 DE 0045', '—', 'Blocked · note by admin', 'BLOCKED', true),
        mk('KA 01 AB 1234', 'AR', 'Asha Rao · B-402', 'RESIDENT', false),
        mk('22 BH 1234 AA', 'VS', 'Vikram S · C-110', 'RESIDENT', false),
        mk('TN 09 CK 4321', 'MD', 'Manoj D · Housekeeping', 'STAFF', false),
        mk('DL 3C AB 1234', 'MK', 'Meera K · D-501', 'RESIDENT', false),
        mk('KA 03 NB 0912', 'PV', 'Visitor for A-207 · till 18:00', 'VISITOR', false),
      ],
    };
  }
}
</script>
</body>
</html>
