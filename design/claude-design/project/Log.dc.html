<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gate log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F3F5F8; color: #0F172A; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column">

<header style="padding: 20px 20px 12px; display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Gate log</h1>
<button type="button" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #DCE1E8; background: #FFFFFF; color: #0F172A; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>Export CSV</button>
</header>

<div style="padding: 0 20px">
<label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #DCE1E8; color: #4B5565">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input type="search" placeholder="Search plate, e.g. KA01" aria-label="Search plate" style="flex-grow: 1; border: none; outline: none; font-family: inherit; font-size: 15px; background: transparent; color: #0F172A">
</label>
</div>

<div role="tablist" aria-label="Filter" style="padding: 12px 20px; display: flex; gap: 8px">
<button type="button" role="tab" aria-selected="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: #0F172A; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">All 270</button>
<button type="button" role="tab" aria-selected="false" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #DCE1E8; background: #FFFFFF; color: #0F172A; font-family: inherit; font-size: 13px; font-weight: 500">Entries</button>
<button type="button" role="tab" aria-selected="false" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #DCE1E8; background: #FFFFFF; color: #0F172A; font-family: inherit; font-size: 13px; font-weight: 500">Exits</button>
<button type="button" role="tab" aria-selected="false" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #DCE1E8; background: #FFFFFF; color: #0F172A; font-family: inherit; font-size: 13px; font-weight: 500">Alerts</button>
</div>

<div style="padding: 4px 20px 8px; font-size: 12px; font-weight: 600; color: #4B5565; letter-spacing: 0.6px">TODAY · FRI 25 SEP</div>

<div style="margin: 0 20px; background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 16px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #EEF1F5">
<span style="width: 36px; height: 36px; border-radius: 10px; background: {{r.iconBg}}; color: {{r.iconFg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<sc-if value="{{r.entry}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"></path></svg></sc-if>
<sc-if value="{{r.exit}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg></sc-if>
</span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; letter-spacing: 0.5px">{{r.plate}}</span>
<span style="font-size: 12px; color: #4B5565; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.who}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #334155">{{r.time}}</span>
<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.4px; padding: 3px 7px; border-radius: 6px; background: {{r.bg}}; color: {{r.fg}}">{{r.tag}}</span>
</div>
</div>
</sc-for>
</div>

<div style="flex-grow: 1"></div>
<dc-import name="NavBar" active="log" hint-size="390px,80px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      allow: { tag: 'ALLOW', bg: '#DCF3E4', fg: '#14532D' },
      visitor: { tag: 'VISITOR', bg: '#DCE7FB', fg: '#1E3A8A' },
      deny: { tag: 'DENY', bg: '#FDE8E8', fg: '#991B1B' },
    };
    const inn = { entry: true, exit: false, iconBg: '#E6F4F2', iconFg: '#0B5F58' };
    const out = { entry: false, exit: true, iconBg: '#EEF1F5', iconFg: '#334155' };
    const rows = [
      { plate: 'KA 01 AB 1234', who: 'Entry · Asha Rao · B-402 · AI 96%', time: '10:42', ...inn, ...T.allow },
      { plate: 'KA 05 MX 7788', who: 'Entry · Unregistered · asked flat no.', time: '10:39', ...inn, ...T.visitor },
      { plate: '22 BH 1234 AA', who: 'Exit · Vikram S · C-110 · AI 93%', time: '10:31', ...out, ...T.allow },
      { plate: 'TN 09 CK 4321', who: 'Exit · Staff · Housekeeping', time: '10:18', ...out, ...T.allow },
      { plate: 'KA 03 NB 0912', who: 'Entry · Visitor for A-207 · Manual', time: '10:02', ...inn, ...T.visitor },
      { plate: 'DL 3C AB 1234', who: 'Entry · Meera K · D-501 · AI 91%', time: '09:47', ...inn, ...T.allow },
      { plate: 'MH 12 DE 0045', who: 'Entry attempt · Blacklisted', time: '09:12', ...inn, ...T.deny },
      { plate: 'KA 51 HG 3301', who: 'Exit · Rahul P · A-104 · AI 97%', time: '08:55', ...out, ...T.allow },
    ];
    return { rows };
  }
}
</script>
</body>
</html>
